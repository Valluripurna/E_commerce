name: Backend CI (Laravel)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, ctype, xml, bcmath
          coverage: none

      - name: Install Dependencies
        run: |
          cd backend
          composer install --prefer-dist --no-progress --no-interaction --no-audit

      - name: Run Tests
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate
          php artisan test
